# Alembic config. The DB URL is injected at runtime by alembic/env.py from the
# app config DATABASE_URL. No real URL, account, or password is stored here.
[alembic]
# migration script dir (relative to backend/, where this ini lives)
script_location = alembic
# prepend backend/ to sys.path so env.py can `import app.*`
prepend_sys_path = .
# sqlalchemy.url is intentionally empty; env.py injects it at runtime
sqlalchemy.url =

# revision filename template
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
