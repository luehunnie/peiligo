# F-09：单机生产编排（冻结架构：Linux/PVE＋Docker Compose＋PostgreSQL＋
# Caddy/HTTPS；无 Redis/Celery/Elasticsearch/SPA/K8s）。
#
# 用法（见 docs/PRODUCTION_RUNBOOK.md）：
#   cp .env.example .env   # 填入真实值（.env 不入库）
#   docker compose up -d --build
#
# 秘密纪律：本文件只做 ${VAR} 插值引用，真实值一律来自同目录 .env
# （compose 自动加载）；镜像内不含任何运行期秘密。

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: peiligo.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      MEDIA_ROOT: /data/media
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    volumes:
      - media:/data/media
      - static:/data/static
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 存活探针不触库；entrypoint 串行完成迁移后 gunicorn 才启动，
      # 故 healthy 亦即迁移完成（scheduler 据此启动）。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "manage.py", "publish_scheduler", "--interval", "60"]
    environment:
      DJANGO_SETTINGS_MODULE: peiligo.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      MEDIA_ROOT: /data/media
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  media:
  static:
  caddy_data:
  caddy_config:
