# F-09：单机生产编排（冻结架构：Linux/PVE＋Docker Compose＋PostgreSQL＋
# Caddy/HTTPS；无 Redis/Celery/Elasticsearch/SPA/K8s）。
#
# 用法（见 docs/PRODUCTION_RUNBOOK.md）：
#   cp .env.example .env   # 填入真实值（.env 不入库）
#   docker compose up -d --build
#
# 秘密纪律：本文件只做 ${VAR} 插值引用，真实值一律来自同目录 .env
# （compose 自动加载）；镜像内不含任何运行期秘密。

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # postgres:18+ 镜像采用 pg_ctlcluster 兼容布局（数据落
      # /var/lib/postgresql/18/docker），挂载点须在 /var/lib/postgresql
      # （挂旧路径 /data 会被镜像拒绝启动，实证于本地 Docker 验证）。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: peiligo.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      # 终审 L-1：后台通知邮件基准地址（production env_required；compose
      # 侧 `:?` 同口径快速失败，部署 .env 与 DOMAIN 同源填写）。
      WAGTAILADMIN_BASE_URL: ${WAGTAILADMIN_BASE_URL:?WAGTAILADMIN_BASE_URL is required}
      MEDIA_ROOT: /data/media
      # 终审 M-1/L-11：反馈邮箱环境兜底值（正式载体为后台站点设置
      # SiteSettings.feedback_email，此处仅部署层缺省；置空视同未设）。
      FEEDBACK_EMAIL: ${FEEDBACK_EMAIL:-feedback@example.com}
      # F-12/F-13（独立审查 P1 修复）：.env 配置须显式透传才进容器。
      # BACKUP_ROOT 缺省落在具名卷 backups（重建容器不丢）；独立副本
      # SECONDARY_BACKUP_DIR 指向宿主/独立挂载路径时由 .env 提供。
      BACKUP_ROOT: ${BACKUP_ROOT:-/data/backups}
      SECONDARY_BACKUP_DIR: ${SECONDARY_BACKUP_DIR:-}
      HSTS_SECONDS: ${HSTS_SECONDS:-31536000}
      OPS_LOG_FILE: ${OPS_LOG_FILE:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    volumes:
      - media:/data/media
      - static:/data/static
      - backups:/data/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 存活探针不触库；entrypoint 串行完成迁移后 gunicorn 才启动，
      # 故 healthy 亦即迁移完成（scheduler 据此启动）。
      # 探针 Host 须取 ALLOWED_HOSTS 首项：Django 按请求 Host 校验，
      # 硬编码 127.0.0.1 会被 DisallowedHost 打成 400（实证于本地
      # Docker 验证），scheduler 永远等不到 healthy。
      test: ["CMD", "python", "-c", "import os,urllib.request; h=os.environ.get('ALLOWED_HOSTS','').split(',')[0].strip() or 'localhost'; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'Host': h}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # F-09（独立审查 P2 修复）：间隔经 SCHED_INTERVAL_SECONDS 环境统一
    # 配置（命令缺省同源读取），不再硬编码 --interval 60 形成死旋钮。
    command: ["python", "manage.py", "publish_scheduler"]
    environment:
      DJANGO_SETTINGS_MODULE: peiligo.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      MEDIA_ROOT: /data/media
      SCHED_INTERVAL_SECONDS: ${SCHED_INTERVAL_SECONDS:-60}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # SPEC-001：新前端应用容器（Astro SSR，生产镜像本体构建自 webapp/）。
  # 无状态：零卷、零宿主端口——仅 Compose 内网供 Caddy 反代与 SSR 取数。
  # 取数经内网直调 web 容器（same-origin 行为由 Caddy 统一呈现）。
  frontend:
    build:
      context: ../webapp
      dockerfile: Dockerfile
    environment:
      # 内网基址 fail-closed（webapp/src/services/api.ts）：生产必须显式
      # 注入，未设置/非法即取数抛错，绝不静默回退。
      PEILIGO_API_BASE_URL: http://web:8000/api/v1
    depends_on:
      web:
        condition: service_healthy
    # 健康语义冻结于 webapp/src/pages/healthz.ts：进程活着即健康（镜像内置
    # HEALTHCHECK；上游 API 故障不翻转，编排层不得据此重启）。
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # SPEC-001：前端切换/回滚唯一开关（Caddyfile 路由表默认上游）。
      # 缺省 web:8000＝v1 整站回根（部署后公开面零变化）；cutover 时置
      # frontend:4321。翻转仅重建本容器（秒级），web/frontend/db/数据面
      # 零接触。缺省值与 Caddyfile 的 {$PEILIGO_DEFAULT_UPSTREAM:web:8000}
      # 回退值 twins——改一处须同步另一处（compose 注入空值会让 Caddy
      # 回退失效）。
      PEILIGO_DEFAULT_UPSTREAM: ${PEILIGO_DEFAULT_UPSTREAM:-web:8000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media:
  static:
  backups:
  caddy_data:
  caddy_config:
